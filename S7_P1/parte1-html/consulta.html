<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Solicitudes</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <main class="contenedor">
        <nav class="menu">
            <ul>
                <li><a href="index.html">Registro de solicitudes</a></li>
                <li><a href="consulta.html">Consultar solicitudes</a></li>
            </ul>
        </nav>

        <section class="tarjeta">
            <header class="encabezado">
                <span class="etiqueta">Mesa de ayuda</span>
                <h1>Consulta de solicitudes</h1>
                <p>Ingrese la prioridad de la solicitud para realizar la busqueda.</p>
            </header>

            <form id="formConsulta" novalidate>
                <div class="campo">
                    <label for="prioridad">Prioridad:</label>
                    <select name="prioridad" id="inputPrioridad">
                        <option value="Todas">Todas</option>
                        <option value="Baja">Baja</option>
                        <option value="Media">Media</option>
                        <option value="Alta">Alta</option>
                    </select>

                </div>

                <button type="submit">Buscar</button>
            </form>
        </section>

        <section class="tarjeta resultados">
            <div class="titulo-lista">
                <div>
                    <span class="etiqueta">Registros</span>
                    <h2>Solicitudes registradas</h2>
                </div>
                <span id="contador">0 solicitudes</span>
            </div>
            <div id="listaSolicitudes">
                <p class="sin-datos">No existen solicitudes registradas.</p>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
</body>

</html>
