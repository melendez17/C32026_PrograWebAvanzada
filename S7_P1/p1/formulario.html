<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Producto</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="container">
        <h2>Registro de Producto</h2>

        <form id="miFormulario">
            <div>
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" placeholder="Ej. Laptop" required>
            </div>
            <div>
                <label for="color">Color</label>
                <input type="text" id="color" placeholder="Ej. Negro" required>
            </div>
            <div>
                <label for="precio">Precio ($)</label>
                <input type="number" id="precio" placeholder="Ej. 750" required>
            </div>
            <div>
                <label for="cantidad">Cantidad</label>
                <input type="number" id="cantidad" placeholder="Ej. 5" required>
            </div>

            <button type="submit">Guardar Producto</button>
        </form>

        <h3>Productos Registrados</h3>

        <!-- Tabla donde se renderizan los productos -->
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Color</th>
                    <th>Precio</th>
                    <th>Cant.</th>
                </tr>
            </thead>
            <tbody id="tablaProductos">
            </tbody>
        </table>
    </div>

    <script src="script.js"></script>
</body>
</html>
